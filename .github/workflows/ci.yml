name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: GrowDiary.React/package-lock.json

      - name: Restore backend
        run: dotnet restore GrowDiary.slnx

      # Die ganze Mappe statt einzelner Projekte: das MCP-Add-on haengt mit an
      # der gemeinsamen Bibliothek, und ein Bruch dort soll hier auffallen und
      # nicht erst beim Image-Bau.
      - name: Build backend
        run: dotnet build GrowDiary.slnx --configuration Release --no-restore

      - name: Test backend
        run: dotnet test GrowDiary.Web.Tests/GrowDiary.Web.Tests.csproj --configuration Release --no-build --verbosity minimal

      - name: Test add-ons
        run: dotnet test GrowMcp.Tests/GrowMcp.Tests.csproj --configuration Release --no-build --verbosity minimal

      - name: Install frontend
        working-directory: GrowDiary.React
        run: npm ci

      - name: Lint frontend
        working-directory: GrowDiary.React
        run: npm run lint

      # Die Vitest-Sammlung lief bis beta.50 in KEINEM Durchlauf mit: das
      # Skript gab es, der Schritt fehlte. Aufgefallen ist es, als ein neuer
      # Test die Menue-Luecke haette halten sollen und niemand ihn ausgefuehrt
      # haette.
      - name: Test frontend
        working-directory: GrowDiary.React
        run: npm test

      - name: Build frontend
        working-directory: GrowDiary.React
        run: npm run build

      - name: Install Playwright browser
        working-directory: GrowDiary.React
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        working-directory: GrowDiary.React
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: GrowDiary.React/playwright-report/
          retention-days: 7
